<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#170b2b">

<title>Dare Accepted ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Poppins", sans-serif;
    color: white;

    background:
        radial-gradient(circle at 50% 30%, #35115d 0%, transparent 35%),
        linear-gradient(180deg, #1d0b35 0%, #0b0615 100%);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.18) 1px, transparent 1px);

    background-size: 55px 55px;
    opacity: .35;
}

.app {
    width: 100%;
    height: 100dvh;
    position: relative;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px 24px;

    opacity: 0;
    visibility: hidden;

    transform: translateX(35px) scale(.98);

    transition:
        opacity .45s ease,
        transform .45s ease,
        visibility .45s;
}

.screen.active {
    opacity: 1;
    visibility: visible;

    transform: translateX(0) scale(1);
}


/* EMOJI */

.emoji {
    font-size: 78px;
    line-height: 1;

    margin-bottom: 45px;

    filter:
        drop-shadow(0 0 15px rgba(255,100,190,.35));

    animation: float 3s ease-in-out infinite;
}

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* SMALL TEXT */

.small-text {
    font-size: 20px;
    line-height: 1.5;

    color: rgba(255,255,255,.82);

    margin-bottom: 20px;

    max-width: 360px;
}


/* HEADINGS */

h1 {
    font-size: clamp(38px, 10vw, 62px);

    line-height: 1.08;

    font-weight: 700;

    margin-bottom: 38px;

    letter-spacing: -1.5px;
}

h2 {
    font-size: clamp(34px, 9vw, 52px);

    line-height: 1.12;

    font-weight: 600;

    margin-bottom: 38px;
}


/* MESSAGE */

.message {
    max-width: 380px;

    font-size: 20px;

    line-height: 1.6;

    color: rgba(255,255,255,.86);

    margin-bottom: 42px;
}


/* BUTTON */

.btn {
    border: none;
    outline: none;

    min-width: 230px;

    padding: 17px 30px;

    border-radius: 50px;

    font-family: "Poppins", sans-serif;

    font-size: 17px;

    font-weight: 600;

    color: white;

    background:
        linear-gradient(
            100deg,
            #f52a9c,
            #8c45f5
        );

    box-shadow:
        0 12px 35px rgba(210,50,190,.28);

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.btn:active {
    transform: scale(.95);
}

.btn:hover {
    box-shadow:
        0 15px 40px rgba(210,50,190,.4);
}


/* DARE TEXT */

.quote {
    max-width: 370px;

    padding: 0 10px;

    font-size: 19px;

    line-height: 1.65;

    color: rgba(255,255,255,.9);

    margin-bottom: 38px;
}

.quote strong {
    color: white;
}


/* FINAL SCREEN */

.final-heart {
    font-size: 75px;

    margin-bottom: 35px;

    animation:
        heartbeat 1.5s ease-in-out infinite;

    filter:
        drop-shadow(0 0 18px rgba(255,60,120,.5));
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }
}

.final-name {
    font-size: 22px;

    color: rgba(255,255,255,.75);

    margin-bottom: 12px;
}


/* I LOVE YOU */

.love-text {
    font-size: 25px;

    font-weight: 600;

    color: #ff79c8;

    margin-bottom: 18px;

    text-shadow:
        0 0 15px rgba(255,80,180,.35);
}


.final-title {
    font-size: clamp(38px, 10vw, 58px);

    font-weight: 700;

    margin-bottom: 15px;
}

.final-message {
    font-size: 18px;

    color: rgba(255,255,255,.72);
}


/* MOBILE */

@media (max-height: 700px) {

    .emoji {
        font-size: 65px;

        margin-bottom: 28px;
    }

    h1,
    h2 {
        margin-bottom: 28px;
    }

    .message {
        margin-bottom: 30px;
    }

    .screen {
        padding-top: 20px;
        padding-bottom: 20px;
    }
}

@media (max-width: 360px) {

    .small-text {
        font-size: 17px;
    }

    .message,
    .quote {
        font-size: 17px;
    }

    .btn {
        min-width: 210px;

        font-size: 15px;
    }

    .love-text {
        font-size: 22px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- SCREEN 1 -->

    <section class="screen active" id="screen1">

        <div class="emoji">
            🙂
        </div>

        <div class="small-text">
            I got a little dare...
        </div>

        <h1>
            So I thought,<br>
            why not?
        </h1>

        <button class="btn" onclick="nextScreen(2)">
            START →
        </button>

    </section>



    <!-- SCREEN 2 -->

    <section class="screen" id="screen2">

        <div class="emoji">
            😎
        </div>

        <h2>
            Here's the dare
        </h2>

        <div class="quote">

            “Mention your favourite person,<br>
            write <strong>I LOVE YOU</strong>,<br>
            and send the screenshot.”

        </div>

        <button class="btn" onclick="nextScreen(3)">
            OKAY... →
        </button>

    </section>



    <!-- SCREEN 3 -->

    <section class="screen" id="screen3">

        <div class="emoji">
            🤫
        </div>

        <div class="small-text">
            Okay...
        </div>

        <h2>
            I know who<br>
            I could mention.
        </h2>

        <button class="btn" onclick="nextScreen(4)">
            NEXT →
        </button>

    </section>



    <!-- SCREEN 4 -->

    <section class="screen" id="screen4">

        <div class="emoji">
            😏
        </div>

        <div class="small-text">
            I could mention her...
        </div>

        <h2>
            But I'll keep<br>
            that a little secret.
        </h2>

        <button class="btn" onclick="nextScreen(5)">
            WHO? 👀
        </button>

    </section>



    <!-- FINAL SCREEN -->

    <section class="screen" id="screen5">

        <div class="final-heart">
            ❤️
        </div>

        <div class="final-name">
            @YOU
        </div>

        <!-- NEW TEXT -->

        <div class="love-text">
            I LOVE YOU ❤️
        </div>

        <div class="final-title">
            Yep. You.
        </div>

        <div class="final-message">
            Dare completed. 
        </div>

    </section>


</div>



<script>

function nextScreen(number) {

    const screens =
        document.querySelectorAll(".screen");

    screens.forEach(screen => {

        screen.classList.remove("active");

    });

    const next =
        document.getElementById("screen" + number);

    if (next) {

        next.classList.add("active");

    }
}

</script>

</body>
</html>
